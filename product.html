<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#F8F5EF" />
<title id="pgTitle">Kamal Jewellers</title>
<meta name="description" id="metaDesc" content="A limited sale piece from Kamal Jewellers, Sadar Bazar, Delhi." />
<link rel="icon" type="image/png" href="logo.png" />
<link rel="apple-touch-icon" href="logo.png" />
<!-- Social share (filled from the product on load) -->
<meta property="og:type" content="product" />
<meta property="og:site_name" content="Kamal Jewellers" />
<meta property="og:title" id="ogTitle" content="Kamal Jewellers" />
<meta property="og:description" id="ogDesc" content="A limited sale piece from Kamal Jewellers." />
<meta property="og:image" id="ogImage" content="https://kamaljewellers.shop/storefront.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" id="twImage" content="https://kamaljewellers.shop/storefront.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="home.css?v=733dd2e059" />
<style>
/* Product page — one piece, nothing competing with it. */
.pd-wrap{max-width:1240px;margin:0 auto;padding:clamp(112px,16vh,150px) var(--pad) 96px}
.pd-crumb{margin-bottom:36px;font:500 11px var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
.pd-crumb a{border-bottom:1px solid var(--line);transition:border-color .3s}
.pd-crumb a:hover{border-color:var(--ink)}
.pd-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(32px,7vw,112px);align-items:start}
.pg-main{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--bg2)}
.pg-main img{width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.pg-off{position:absolute;top:14px;left:14px;padding:7px 12px;background:var(--bg);font:500 11px var(--ui);letter-spacing:.16em;text-transform:uppercase}
.pg-thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.pg-thumb{width:72px;aspect-ratio:1;padding:0;border:0;background:var(--bg2);overflow:hidden;opacity:.5;transition:opacity .4s}
.pg-thumb.on,.pg-thumb:hover{opacity:1}
.pg-thumb img{width:100%;height:100%;object-fit:cover}
.pi{position:sticky;top:104px}
.pi-name{margin:18px 0 14px;font:400 clamp(40px,5vw,68px)/1 var(--display);letter-spacing:-.02em}
.pi-note{margin-bottom:22px;color:var(--ink2)}
.pi-prices{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;margin:20px 0 6px}
.pi-sale{font:400 40px/1 var(--display)}
.pi-orig{color:var(--ink2);text-decoration:line-through}
.pi-save{font:500 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.pi-stock{margin:14px 0 28px;font:500 11px var(--ui);letter-spacing:.18em;text-transform:uppercase}
.pi-stock.in{color:#2F7A55}.pi-stock.low{color:#A8641A}.pi-stock.out{color:#A33A3A}
.pi-qty-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin-bottom:24px}
.pi-qty-lbl{font:500 11px var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
.pi-qty{display:inline-flex;align-items:center;border:1px solid var(--line)}
.pi-qty button{width:46px;height:46px;border:0;background:none;font-size:18px}
.pi-qty button:disabled{opacity:.3;cursor:default}
.pi-qty .n{min-width:40px;text-align:center}
.pi-total{color:var(--ink2);font-size:14px}
.pi-total b{color:var(--ink);font-weight:500}
.pi-reserve{width:100%;gap:12px}
.pi-reserve svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pi-reserve.disabled{border-color:var(--line);background:transparent;color:var(--ink2);pointer-events:none}
.pi-block{margin-top:44px;padding-top:24px;border-top:1px solid var(--line)}
.pi-block h3{margin-bottom:14px;font:500 11px var(--ui);letter-spacing:.26em;text-transform:uppercase;color:var(--ink2)}
.pi-desc{white-space:pre-line;color:var(--ink2)}
.pi-specs{width:100%;border-collapse:collapse}
.pi-specs td{padding:12px 0;border-top:1px solid var(--line);vertical-align:top}
.pi-specs tr:first-child td{border-top:0}
.pi-specs .k{width:42%;padding-right:16px;font:500 11px/1.9 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)}
.pr-sec{margin-top:clamp(64px,9vw,112px);padding-top:clamp(40px,6vw,64px);border-top:1px solid var(--line)}
.pr-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:32px}
.pr-head h2{font:400 clamp(34px,4.4vw,56px)/1 var(--display);letter-spacing:-.02em}
.pr-avg{font-size:14px;color:var(--ink2)}
.stars{color:var(--acc);letter-spacing:.14em}
.pr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:36px}
.pr-card{padding-top:18px;border-top:1px solid var(--line)}
.pr-card .txt{margin:12px 0;font:italic 400 22px/1.35 var(--display)}
.pr-card .who{font:500 11px var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
.pr-empty{color:var(--ink2)}
.pdp-404{max-width:560px;margin:0 auto;padding:clamp(160px,26vh,240px) var(--pad) 120px;text-align:center}
.pdp-404 h1{font:400 clamp(40px,6vw,64px)/1 var(--display);margin-bottom:18px}
.pdp-404 p{margin-bottom:32px;color:var(--ink2)}
.pd-foot{padding:36px var(--pad) 48px;border-top:1px solid var(--line);text-align:center;font:500 11px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)}
.pd-foot a{border-bottom:1px solid var(--line);margin-left:12px}
@media(max-width:860px){.pd-grid{grid-template-columns:1fr}.pi{position:static}}
</style>
</head>
<body>

<header class="nav solid" id="nav">
  <a class="brand" href="/" aria-label="Kamal Jewellers — home"><img src="logo.png" alt="" width="34" height="34" /><span><b>KAMAL JEWELLERS</b></span></a>
  <div class="nav-r"><a class="pill" href="/#sale">All sale pieces</a></div>
</header>

<main id="app"><!-- rendered by JS --></main>

<footer class="pd-foot">© Kamal Jewellers · Sadar Bazar, Delhi <a href="/">Back to the website</a></footer>

<script src="config.js"></script>
<script>
const API = ((window.KAMAL_CONFIG || {}).API_BASE) || '/api';
const esc = s => (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const waDigits = n => (n || '').replace(/[^0-9]/g, '');
const inr = n => '₹' + Number(n || 0).toLocaleString('en-IN');
const imgSrc = x => (x == null ? '' : (typeof x === 'string' ? x : x.url || ''));
const abs = u => (/^(https?:|\/)/.test(u) ? u : '/' + u);

let CONTENT = { contact: { whatsapp: '+91 74285 26559', phone1: '+91 98119 07365' }, saleItems: [] };
function merge(base, over) {
  if (Array.isArray(over)) return over;
  if (over && typeof over === 'object') { const o = Object.assign({}, base); for (const k in over) o[k] = merge(base ? base[k] : undefined, over[k]); return o; }
  return over === undefined ? base : over;
}
async function loadContent() {
  try { const res = await fetch(API + '/content?_=' + Date.now()); if (res.ok) { const { data } = await res.json(); if (data) CONTENT = merge(CONTENT, data); } }
  catch (e) { console.warn('content fetch failed', e); }
}
const salePrice = it => Math.round((it.originalPrice || 0) * (1 - (it.discountPct || 0) / 100));
const getId = () => new URLSearchParams(location.search).get('id');

function render() {
  const app = document.getElementById('app');
  const item = (CONTENT.saleItems || []).find(i => i.id === getId());

  if (!item || item.active === false) {
    app.innerHTML = `<div class="pdp-404"><h1>Piece not found</h1><p>This item may have sold out or been taken off sale.</p><a class="btn solid" href="/#sale">Back to the sale</a></div>`;
    document.getElementById('pgTitle').textContent = 'Not found · Kamal Jewellers';
    return;
  }

  const sp = salePrice(item);
  const images = (item.images && item.images.length ? item.images : (item.photo ? [item.photo] : [])).map(imgSrc).filter(Boolean).map(abs);
  const cover = images[0] || '';
  const stock = Number(item.stock) || 0;
  const soldOut = stock <= 0, low = !soldOut && stock <= 3;

  // SEO / share
  document.getElementById('pgTitle').textContent = `${item.name} · Sale · Kamal Jewellers`;
  const desc = item.note || item.description || `${item.name} — now ${inr(sp)} at Kamal Jewellers.`;
  document.getElementById('metaDesc').setAttribute('content', desc);
  document.getElementById('ogTitle').setAttribute('content', `${item.name} — ${inr(sp)}`);
  document.getElementById('ogDesc').setAttribute('content', desc);
  if (cover) { const a = cover.startsWith('http') ? cover : location.origin + cover; document.getElementById('ogImage').setAttribute('content', a); document.getElementById('twImage').setAttribute('content', a); }

  const details = (item.details || []).filter(d => d.label || d.value);
  const reviews = (item.reviews || []).filter(r => r.text || r.name);
  const avg = reviews.length ? (reviews.reduce((s, r) => s + (Number(r.rating) || 5), 0) / reviews.length) : 0;
  const stars = n => '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));

  app.innerHTML = `
    <section class="pd-wrap">
      <div class="pd-crumb"><a href="/">Home</a> / <a href="/#sale">Sale</a> / ${esc(item.name)}</div>
      <div class="pd-grid">
        <div>
          <div class="pg-main">${item.discountPct ? `<div class="pg-off">${esc(item.discountPct)}% off</div>` : ''}${cover ? `<img id="pgMain" src="${esc(cover)}" alt="${esc(item.name)}" />` : ''}</div>
          ${images.length > 1 ? `<div class="pg-thumbs">${images.map((u, i) => `<button type="button" class="pg-thumb${i === 0 ? ' on' : ''}" data-i="${i}" aria-label="Show photo ${i + 1}"><img src="${esc(u)}" alt=""></button>`).join('')}</div>` : ''}
        </div>
        <div class="pi">
          <p class="eyebrow">${item.sku ? esc(item.sku) + ' · ' : ''}Limited sale piece</p>
          <h1 class="pi-name">${esc(item.name)}</h1>
          ${item.note ? `<p class="pi-note">${esc(item.note)}</p>` : ''}
          <div class="pi-prices"><span class="pi-sale">${inr(sp)}</span>${item.discountPct ? `<span class="pi-orig">${inr(item.originalPrice)}</span><span class="pi-save">Save ${inr((item.originalPrice || 0) - sp)}</span>` : ''}</div>
          <div class="pi-stock ${soldOut ? 'out' : (low ? 'low' : 'in')}">${soldOut ? 'Sold out' : (low ? `Only ${stock} left` : `${stock} in stock`)}</div>
          <div class="pi-qty-wrap" ${soldOut ? 'style="display:none"' : ''}>
            <span class="pi-qty-lbl">Quantity</span>
            <div class="pi-qty"><button type="button" id="qDec" aria-label="Decrease">−</button><span class="n" id="qN">1</span><button type="button" id="qInc" aria-label="Increase">+</button></div>
            <span class="pi-total">Total <b id="qTotal">${inr(sp)}</b></span>
          </div>
          ${soldOut ? `<span class="btn pi-reserve disabled">Sold out</span>`
            : `<a class="btn solid pi-reserve" id="reserveBtn" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Reserve via WhatsApp</a>`}
          ${item.description ? `<div class="pi-block"><h3>Description</h3><div class="pi-desc">${esc(item.description)}</div></div>` : ''}
          ${details.length ? `<div class="pi-block"><h3>Product details</h3><table class="pi-specs"><tbody>${details.map(d => `<tr><td class="k">${esc(d.label)}</td><td>${esc(d.value)}</td></tr>`).join('')}</tbody></table></div>` : ''}
        </div>
      </div>
      <div class="pr-sec">
        <div class="pr-head"><h2>Customer reviews</h2>${reviews.length ? `<div class="pr-avg"><span class="stars">${stars(avg)}</span> ${avg.toFixed(1)} · ${reviews.length} review${reviews.length > 1 ? 's' : ''}</div>` : ''}</div>
        ${reviews.length ? `<div class="pr-grid">${reviews.map(r => `<div class="pr-card"><div class="stars">${stars(Number(r.rating) || 5)}</div>${r.text ? `<p class="txt">${esc(r.text)}</p>` : ''}${r.name ? `<div class="who">${esc(r.name)}</div>` : ''}</div>`).join('')}</div>` : `<p class="pr-empty">No reviews yet for this piece.</p>`}
      </div>
    </section>`;

  // gallery
  const main = document.getElementById('pgMain');
  app.querySelectorAll('.pg-thumb').forEach(t => t.addEventListener('click', () => {
    const i = Number(t.dataset.i); main.style.opacity = '0';
    setTimeout(() => { main.src = images[i]; main.style.opacity = '1'; }, 200);
    app.querySelectorAll('.pg-thumb').forEach(x => x.classList.toggle('on', x === t));
  }));

  // quantity + reserve
  if (!soldOut) {
    let qty = 1;
    const qN = document.getElementById('qN'), qTotal = document.getElementById('qTotal');
    const dec = document.getElementById('qDec'), inc = document.getElementById('qInc'), btn = document.getElementById('reserveBtn');
    const wa = waDigits((CONTENT.contact || {}).whatsapp) || waDigits((CONTENT.contact || {}).phone1);
    const sync = () => {
      qN.textContent = qty; qTotal.textContent = inr(sp * qty);
      dec.disabled = qty <= 1; inc.disabled = qty >= stock;
      const msg = `Hi Kamal Jewellers! I'd like to reserve ${qty} × "${item.name}"${item.sku ? ` (${item.sku})` : ''} at ${inr(sp)} each — total ${inr(sp * qty)}. Is it available?`;
      btn.href = wa ? `https://wa.me/${wa}?text=${encodeURIComponent(msg)}` : '#';
    };
    dec.addEventListener('click', () => { if (qty > 1) { qty--; sync(); } });
    inc.addEventListener('click', () => { if (qty < stock) { qty++; sync(); } });
    sync();
  }
}
loadContent().then(render).catch(e => { console.error(e); render(); });
</script>
</body>
</html>
